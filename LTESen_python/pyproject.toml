[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ltesen"
version = "0.1.0"
description = "Python rewrite of the LTE sensing processing pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
ltesen = ["config/default.yaml"]
